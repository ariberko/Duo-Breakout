# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
# The game code lives in DuoBreakout.swiftpm so the iPad Playgrounds app and the
# App Store app share one copy.
name: DuoBreakout
options:
  bundleIdPrefix: com.ariberkowitz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: HKA3SA3729
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  DuoBreakout:
    type: application
    platform: iOS
    sources:
      # Point at the folders inside, not the .swiftpm folder itself:
      # Xcode would copy a ".swiftpm" folder in as a file instead of compiling it.
      - DuoBreakout.swiftpm/App
      - DuoBreakout.swiftpm/Game
      - AppAssets/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariberkowitz.duobreakout
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: AppAssets/Info.plist
      properties:
        CFBundleDisplayName: Duo Breakout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.arcade-games
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  DuoBreakout:
    build:
      targets:
        DuoBreakout: all
    run:
      config: Debug
    archive:
      config: Release
